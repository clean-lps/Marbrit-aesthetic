name: Deploy to External Repository

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        
      - name: Add .nojekyll to dist
        run: touch dist/.nojekyll

      - name: Deploy to external repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_PAT }}
          external_repository: clean-lps/dnielpy-vinyls-deploy
          publish_branch: gh-pages
          publish_dir: ./dist
